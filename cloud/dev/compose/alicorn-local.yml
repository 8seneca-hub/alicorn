name: alicorn-local
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: alicorn
      POSTGRES_PASSWORD: alicorn
      POSTGRES_DB: alicorn
    # Why: POSTGRES_USER is a superuser and owns the database only — control-api,
    # ledger-api and the seed all connect as `alicorn_app` (see postgres-init/), so RLS applies.
    ports: ["127.0.0.1:${ALICORN_PG_PORT:-5432}:5432"]
    volumes:
      - alicorn-pg:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U alicorn"], interval: 5s, timeout: 3s, retries: 20 }
  control-api:
    build: { context: ../.., dockerfile: apps/control-api/Dockerfile }
    environment:
      PORT: "8081"
      ALICORN_DATABASE_URL: postgres://alicorn_app:alicorn_app@postgres:5432/alicorn
      ALICORN_AUTH_MODE: ${ALICORN_AUTH_MODE:-local}
      ALICORN_TENANT_ID: local
      ALICORN_LOCAL_API_TOKEN: ${ALICORN_LOCAL_API_TOKEN:-local-dev-token-change-me-0001}
      ALICORN_KEYCLOAK_ISSUER: http://127.0.0.1:8080/realms/alicorn
      ALICORN_KEYCLOAK_INTERNAL_ISSUER: http://keycloak:8080/realms/alicorn
      ALICORN_DESKTOP_CLIENT_ID: alicorn-desktop
    ports: ["127.0.0.1:8081:8081"]
    depends_on: { postgres: { condition: service_healthy } }
  ledger-api:
    build: { context: ../.., dockerfile: apps/ledger-api/Dockerfile }
    environment:
      PORT: "8082"
      ALICORN_DATABASE_URL: postgres://alicorn_app:alicorn_app@postgres:5432/alicorn
      ALICORN_AUTH_MODE: ${ALICORN_AUTH_MODE:-local}
      ALICORN_TENANT_ID: local
      ALICORN_LOCAL_API_TOKEN: ${ALICORN_LOCAL_API_TOKEN:-local-dev-token-change-me-0001}
      ALICORN_KEYCLOAK_ISSUER: http://127.0.0.1:8080/realms/alicorn
      ALICORN_KEYCLOAK_INTERNAL_ISSUER: http://keycloak:8080/realms/alicorn
      ALICORN_DESKTOP_CLIENT_ID: alicorn-desktop
      # PV2. No default: an unset key makes the signed-export route refuse (503) rather than serve
      # an unsigned artefact. Mint a throwaway P-256 key for local work — see cloud/README.md.
      ALICORN_LEDGER_EXPORT_SIGNING_KEY_PEM: ${ALICORN_LEDGER_EXPORT_SIGNING_KEY_PEM:-}
      ALICORN_LEDGER_EXPORT_SIGNING_KEY_ID: ${ALICORN_LEDGER_EXPORT_SIGNING_KEY_ID:-}
    ports: ["127.0.0.1:8082:8082"]
    depends_on: { postgres: { condition: service_healthy } }
  keycloak:
    image: quay.io/keycloak/keycloak:26.5.2
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${ALICORN_KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/alicorn
      KC_DB_SCHEMA: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      # Why: `iss` in every token must equal what the desktop and the APIs are configured with.
      KC_HOSTNAME: http://127.0.0.1:8080
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    ports: ["127.0.0.1:8080:8080"]
    volumes: ["../keycloak:/opt/keycloak/data/import:ro"]
    depends_on: { postgres: { condition: service_healthy } }
    healthcheck: { test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\r\nhost: localhost\r\n\r\n' >&3 && grep -q '\"status\": \"UP\"' <&3"], interval: 10s, timeout: 5s, retries: 30 }
volumes: { alicorn-pg: {} }
