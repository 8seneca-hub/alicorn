<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  Alicorn's mark: a horn and a swept wing.

  White-filled on purpose — `.titlebar-logo` inverts it for light mode with a CSS filter, so a
  single flat fill is the contract, not a stylistic choice. Flat shapes and no strokes, because
  the titlebar renders this at 16px tall and anything finer turns to mush at that size.
-->
<svg
   version="1.1"
   width="40"
   height="32"
   viewBox="0 0 40 32"
   fill="none"
   xmlns="http://www.w3.org/2000/svg">
  <g fill="#ffffff">
    <!-- The horn: a tapered spire. -->
    <path d="M33.2 1.4 L24.6 19.4 L20.1 16.9 Z" />
    <!-- The wing: three feathers fanning back from the shoulder, longest on top. -->
    <path d="M22.6 18.6 C 15.4 18.6 7.6 20.4 2.0 24.2 C 9.0 23.0 15.6 22.6 21.2 22.9 Z" />
    <path d="M22.4 22.6 C 16.2 23.2 9.8 25.4 5.2 28.6 C 11.2 27.4 16.6 26.9 21.3 27.0 Z" />
    <path d="M22.2 26.6 C 17.6 27.6 13.0 29.4 9.6 31.4 C 14.2 30.7 18.2 30.4 21.4 30.5 Z" />
  </g>
</svg>
