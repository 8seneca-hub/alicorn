title: Page not found — Alicorn
desc: That page does not exist.
-->

  <div class="wrap stack-6">
    <span class="label reveal">404</span>
    <h1 class="reveal" style="font-size:var(--text-title);letter-spacing:var(--tracking-title)">That page does not exist</h1>
    <p class="lede reveal" style="margin-inline:auto">It may have moved, or the link may be wrong.</p>
    <div class="row reveal" style="justify-content:center">
      <a class="btn btn--primary" href="/">Back to the homepage</a>
      <a class="btn btn--outline" href="/docs">Documentation</a>
    </div>
  </div>
</section>
